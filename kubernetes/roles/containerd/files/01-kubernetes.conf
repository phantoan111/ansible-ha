# CRI-O Configuration for Kubernetes

[crio]
  # Root directory for CRI-O data
  root = "/var/lib/containers/storage"

  # Directory for runtime state
  runroot = "/var/run/containers/storage"

  # Storage driver (overlay recommended)
  storage_driver = "overlay"

  # Storage options
  storage_option = [
    "overlay.override_kernel_check=1",
  ]

[crio.api]
  # Listen on unix socket
  listen = "/var/run/crio/crio.sock"

  # Socket directory permissions
  stream_address = "127.0.0.1"
  stream_port = "0"

[crio.runtime]
  # Default runtime (crun)
  default_runtime = "crun"

  # Container runtime options
  no_pivot = false

  # SELinux (disable if not using)
  selinux = false

  # AppArmor (enable on Ubuntu)
  apparmor_profile = "crio-default"

  # Seccomp profile
  seccomp_profile = "/usr/share/containers/seccomp.json"

  # Cgroup manager (systemd recommended)
  cgroup_manager = "systemd"

  # Conmon binary path
  conmon = "/usr/bin/conmon"

  # Conmon environment variables
  conmon_env = [
    "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
  ]

  # Hooks directory
  hooks_dir = [
    "/usr/share/containers/oci/hooks.d",
  ]

  # Default capabilities
  default_capabilities = [
    "CHOWN",
    "DAC_OVERRIDE",
    "FSETID",
    "FOWNER",
    "SETGID",
    "SETUID",
    "SETPCAP",
    "NET_BIND_SERVICE",
    "KILL",
  ]

[crio.runtime.runtimes.crun]
  # Path to crun binary
  runtime_path = "/usr/bin/crun"

  # Runtime type
  runtime_type = "oci"

  # Runtime root
  runtime_root = "/run/crun"

[crio.image]
  # Default transport for pulling images
  default_transport = "docker://"

  # Global auth file
  global_auth_file = ""

  # Pause image for pod infrastructure containers
  pause_image = "registry.k8s.io/pause:3.10.2"

  # Pause image authentication
  pause_image_auth_file = ""

  # Pause command
  pause_command = "/pause"

[crio.network]
  # Network configuration directory
  network_dir = "/etc/cni/net.d/"

  # CNI plugin binary directory
  plugin_dirs = [
    "/opt/cni/bin/",
  ]

[crio.metrics]
  # Enable metrics endpoint
  enable_metrics = true

  # Metrics port
  metrics_port = 9090