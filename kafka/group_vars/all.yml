#version jdk
jdk_version: "17"

#kafka user
kafka_group: "kafka"
kafka_user: "kafka"

#kafka dir
kafka_data_dir: "/data/kafka/data"
kafka_log_dir: "/data/kafka/log"
kafka_root_dir: "/data/kafka"



scala_version: ""
kafka_version: ""
kafka_download_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ scala_version }}-{{ kafka_version }}.tgz"

kafka_port: "9092"
kafka_controller_port: "9093"

## Zookeeper config
zookeeper_data_dir: "/data/kafka/data"
zookeeper_log_dir: "/data/kafka/log"

zookeeper_client_port: "2181"
zookeeper_ticktime: 3000
zookeeper_init_limit: 10
zookeeper_sync_limit: 5
zookeeper_autopurge_snap_retain_count: 3
zookeeper_purge_interval: 0

zookeeper_leader_port: 2888
zookeeper_election_port: 3888



##Kraft config##############################################
#kafka_cluster_id: ""
# kraft topic default
kraft_num_partitions: 3
kraft_default_replication_factor: 3
kraft_insync_replicas: 2
kraft_num_recovery_threads_per_data_dir: 2
kraft_replica_fetch_max_bytes: 3000000

#kraft internal Topic

kraft_offsets_topic_replication_factor: 3
kraft_share_coordinator_state_topic_replication_factor: 3
kraft_share_coordinator_state_topic_min_isr: 2
kraft_transaction_state_log_replication_factor: 3
kraft_transaction_state_log_min_isr: 2

#kraft log retention
kraft_log_retention_hours: 168
kraft_log_retention_bytes: -1
kraft_log_segment_bytes: 1073741824
kraft_log_retention_check_interval_ms: 300000
kraft_message_max_bytes: 3000000
kraft_log_flush_interval_messages: 10000

# Kraft Consumer group configuration
kraft_group_initial_rebalance_delay_ms: 3000

# Kraft Network thread
kraft_num_network_threads: 5
kraft_num_io_threads: 8
kraft_socket_send_buffer_bytes: 102400
kraft_socket_receive_buffer_bytes: 102400
kraft_socket_request_max_bytes: 104857600


# Kraft service config
kraft_Xms: "Xms1g"
kraft_Xmx: "Xmx1g"
kraft_JVM_PERFORMANCE_OPTS_Use: "+UseG1GC"
kraft_JVM_PERFORMANCE_OPTS_MaxGCPauseMillis: 20
kraft_JVM_PERFORMANCE_OPTS_InitiatingHeapOccupancyPercent: 35


