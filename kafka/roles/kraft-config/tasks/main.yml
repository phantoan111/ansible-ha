- name: Deploy KRaft server properties
  ansible.builtin.template:
    src: kraft-server.properties.j2
    dest: "{{ kafka_root_dir }}/config/server.properties"
    owner: {{ kafka_user }}
    group: {{ kafka_group }}
    mode: "0640"

- name: Deploy Kafka systemd service files
  ansible.builtin.template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    mode: "0644"

- name: Force systemd to reread configs (systemctl daemon-reload)
  ansible.builtin.systemd_service:
    daemon_reload: true