- name: Create cluster uuid
  ansible.builtin.command:
    cmd: "{{ kafka_root_dir }}/bin/kafka-storage.sh random-uuid"
  register: kafka_cluster_id_uuid

- name: Set cluster uuid
  ansible.builtin.set_fact:
    kafka_cluster_id: "{{ kafka_cluster_id_uuid.stdout }}"



- name: Create controller 1 uuid
  ansible.builtin.command:
    cmd: "{{ kafka_root_dir }}/bin/kafka-storage.sh random-uuid"
  register: kafka_controller_id_1_uuid

- name: Set controller 1 uuid
  ansible.builtin.set_fact:
    kafka_controller_id_1: "{{ kafka_controller_id_1_uuid.stdout }}"


- name: Create controller 2 uuid
  ansible.builtin.command:
    cmd: "{{ kafka_root_dir }}/bin/kafka-storage.sh random-uuid"
  register: kafka_controller_id_2_uuid


- name: Set cluster uuid
  ansible.builtin.set_fact:
    kafka_controller_id_2: "{{ kafka_controller_id_2_uuid.stdout }}"

- name: Create controller 3 uuid
  ansible.builtin.command:
    cmd: "{{ kafka_root_dir }}/bin/kafka-storage.sh random-uuid"
  register: kafka_controller_id_3_uuid

- name: Set cluster uuid
  ansible.builtin.set_fact:
    kafka_controller_id_3: "{{ kafka_controller_id_3_uuid.stdout }}"




###Init KRAFT
- name: Init cluster Kraft
  ansible.builtin.command:
    cmd: >
      {{ kafka_root_dir }}/bin/kafka-storage.sh format
      --cluster-id  {{ kafka_cluster_id }}
      --initial-controllers "{{ hostvars[kafka-1].kafka_broker_id }}@{{ hostvars[kafka-1].ansible_host }}:{{ kafka_controller_port }}:{{ kafka_controller_id_2_uuid }},{{ hostvars[kafka-2].kafka_broker_id }}@{{ hostvars[kafka-2].ansible_host }}:{{ kafka_controller_port }}:{{ kafka_controller_id_2_uuid }},{{ hostvars[kafka-3].kafka_broker_id }}@{{ hostvars[kafka-3].ansible_host }}:{{ kafka_controller_port }}:{{ kafka_controller_id_3_uuid }}"
      --config {{ kafka_root_dir }}/config/server.properties

