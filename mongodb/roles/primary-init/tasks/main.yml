
- name: Initialize replica set
  command: >
    mongosh --quiet --port {{ mongodb_port }} --eval "
    rs.initiate({
      _id: '{{ mongodb_replset_name }}',
      members: [
    {% for host in groups['mongodb'] %}
        { _id: {{ loop.index0 }}, host: '{{ hostvars[host].ansible_host }}:{{ mongodb_port }}', priority: {{ hostvars[host].mongodb_priority }} }{{ ',' if not loop.last else '' }}
    {% endfor %}
      ]
    })"


